[platformio]
default_envs = xteink_x4
core_dir = .platformio
src_dir = firmware/src

[env:xteink_x4]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
extra_scripts = post:scripts/archive_firmware.py
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.40900.250804
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE
    -DUSE_UTF8_LONG_NAMES=1
lib_deps =
    ESP32YmodemReceiver=symlink://third_party/esp32-ymodem/components/ymodem
    BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
    InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
    EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
    SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
    greiman/SdFat@2.3.1
    bblanchon/ArduinoJson@6.21.5
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.17.0
