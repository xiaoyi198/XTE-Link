[package]
name = "xte-clash-bridge-harness"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "=0.1.92"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
warp = { version = "=0.4.3", features = ["server", "test"] }
